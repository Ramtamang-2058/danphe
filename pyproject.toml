[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danphe"
version = "0.1.0"
description = "Agentic dev CLI — NVIDIA / Gemini / devloop backend"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "google-generativeai>=0.7",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "toml>=0.10",
]

[project.scripts]
danphe = "danphe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
